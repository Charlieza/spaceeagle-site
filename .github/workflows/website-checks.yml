name: Website checks
on:
  push:
    branches: [main, codex/nature-intelligence-ecosystem]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check routes, assets and platform links
        run: python scripts/check_site.py
